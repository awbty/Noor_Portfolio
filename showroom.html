<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showroom | Noor Al-Huwaidi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>

<nav>
    <div class="container nav-inner">

        <!-- NEW: Container that holds both Logo and Text together -->
        <a href="index.html" class="logo-container">
            <img src="images/Navigation_logo.png" class="logo-img" alt="Noor Logo">
            <div class="logo-text">Noor Al-huwaidi</div>
        </a>

        <!-- Hamburger toggle (visible on mobile) -->
        <button id="navToggle" class="nav-toggle" aria-label="Open menu" aria-expanded="false">
            <span></span>
        </button>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="cv.html">CV</a>
            <!--a href="journal.html">Journal</a-->
            <a href="showroom.html">Showroom</a>
        </div>
    </div>
</nav>

<section id="showroom" style="padding-top: 120px;">
    <div class="container">
        <h2>The Showroom</h2>

        <div style="text-align: center; margin-bottom: 50px;">
            <button class="btn" style="margin: 5px; background: var(--text-main);" onclick="filterProjects('all', this)">All</button>
            <button class="btn" style="margin: 5px; background: transparent; color: var(--text-main);" onclick="filterProjects('residential', this)">Residential</button>
            <button class="btn" style="margin: 5px; background: transparent; color: var(--text-main);" onclick="filterProjects('commercial', this)">Commercial</button>
            <button class="btn" style="margin: 5px; background: transparent; color: var(--text-main);" onclick="filterProjects('booths', this)">Booths</button>
        </div>

        <div class="project-gallery" id="gallery">

            <!-- Projects are injected here dynamically by JS -->

        </div>
    </div>
</section>

<footer>
    <div class="container">
        <p class="copyright">Designed and Developed by Awwab Mohammed &copy; 2026 Noor Al-Huwaidi. All rights reserved.</p>
    </div>
</footer>

<script>

    let galleryData = {};
    let currentIndex = {};

    fetch('data/projects.json')
        .then(res => res.json())
        .then(projects => {
            buildGallery(projects);
            buildModals(projects);
        })
        .catch(err => console.error('Failed to load projects:', err));

    function buildGallery(projects) {
        const gallery = document.getElementById('gallery');
        projects.forEach(p => {
            const card = document.createElement('div');
            card.className = 'project-item';
            card.setAttribute('data-category', p.category);
            card.onclick = () => openModal(p.id);
            card.innerHTML = `
                <div class="project-visuals">
                    <img src="${p.thumbnail}" alt="${p.title}">
                </div>
                <div class="project-info">
                    <h3>${p.title}</h3>
                    <span class="project-link">View Project Gallery & Description →</span>
                </div>`;
            gallery.appendChild(card);

            galleryData[p.id] = p.images.map(src => ({ src }));
            currentIndex[p.id] = 0;
        });
    }

    function buildModals(projects) {
        projects.forEach(p => {
            const cadHTML = (p.cadImages || [])
                .map(src => `<img class="cad-img" src="${src}" alt="CAD Drawing">`)
                .join('');

            const sectionsHTML = (p.sections || [])
                .map(s => `<h3>${s.heading}</h3><p>${s.body}</p>`)
                .join('');

            const modal = document.createElement('div');
            modal.id = p.id;
            modal.className = 'modal';
            modal.innerHTML = `
                <span class="close" onclick="closeModal('${p.id}')">&times;</span>
                <div class="modal-content modal-layout-showroom">
                    <div class="showroom-gallery">
                        <button class="gallery-btn gallery-prev" onclick="changeImage('${p.id}', -1)">&#10094;</button>
                        <img id="${p.id}-img" src="${p.images[0]}" alt="Project View">
                        <button class="gallery-btn gallery-next" onclick="changeImage('${p.id}', 1)">&#10095;</button>
                    </div>
                    <div class="showroom-details">
                        <h2>${p.title}</h2>
                        ${p.inspiration ? `<p class="inspiration-text"><strong>Inspiration:</strong> ${p.inspiration}</p>` : ''}
                        <div id="${p.id}-desc" style="margin-top: 20px; font-size: 1.05rem; color: var(--text-main);">
                            ${sectionsHTML}
                        </div>
                        ${cadHTML}
                    </div>
                </div>`;
            document.body.appendChild(modal);
        });
    }

    function changeImage(modalId, direction) {
        const images = galleryData[modalId];
        currentIndex[modalId] += direction;

        if (currentIndex[modalId] >= images.length) {
            currentIndex[modalId] = 0;
        } else if (currentIndex[modalId] < 0) {
            currentIndex[modalId] = images.length - 1;
        }

        const imgElement = document.getElementById(modalId + '-img');
        const nextImg = new Image();
        nextImg.src = images[currentIndex[modalId]].src;
        nextImg.onload = function() {
            imgElement.src = this.src;
        };
    }

    function filterProjects(category, btn) {
        const buttons = document.querySelectorAll('#showroom .btn');
        buttons.forEach(b => {
            b.style.background = 'transparent';
            b.style.color = 'var(--text-main)';
        });
        btn.style.background = 'var(--text-main)';
        btn.style.color = 'var(--white)';

        const items = document.querySelectorAll('.project-item');
        items.forEach(item => {
            if (category === 'all' || item.getAttribute('data-category') === category) {
                item.style.display = 'block';
            } else {
                item.style.display = 'none';
            }
        });
    }

    function openModal(modalId) {
        currentIndex[modalId] = 0;
        document.getElementById(modalId + '-img').src = galleryData[modalId][0].src;
        document.getElementById(modalId).style.display = 'block';
        setTimeout(() => document.getElementById(modalId).classList.add('show'), 10);
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('show');
        setTimeout(() => document.getElementById(modalId).style.display = 'none', 300);
    }

    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.classList.remove('show');
            setTimeout(() => event.target.style.display = 'none', 300);
        }
    };


</script>
<script>
    // Mobile nav toggle (hamburger)
    (function(){
        const nav = document.querySelector('nav');
        const navToggle = document.getElementById('navToggle');
        if (!navToggle) return;

        navToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            const opened = nav.classList.toggle('nav-open');
            navToggle.setAttribute('aria-expanded', opened ? 'true' : 'false');
        });

        document.addEventListener('click', (e) => {
            if (!nav.contains(e.target) && nav.classList.contains('nav-open')) {
                nav.classList.remove('nav-open');
                navToggle.setAttribute('aria-expanded', 'false');
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768 && nav.classList.contains('nav-open')) {
                nav.classList.remove('nav-open');
                navToggle.setAttribute('aria-expanded', 'false');
            }
        });
    })();
</script>
</body>
</html>
